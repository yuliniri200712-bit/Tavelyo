# Integración continua (D-18, Fase 1 bloque 3). Sin secretos: todo corre contra emuladores con el
# proyecto demo-tavelyo, que no puede acceder a la nube.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.19.0'
  FIREBASE_TOOLS: 'firebase-tools@15.30.2'
  # Configuración pública del proyecto demo (igual que .env.example).
  VITE_FIREBASE_PROJECT_ID: demo-tavelyo
  VITE_FIREBASE_API_KEY: demo-api-key
  VITE_FIREBASE_AUTH_DOMAIN: demo-tavelyo.firebaseapp.com
  VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
  VITE_USE_EMULATORS: 'true'

jobs:
  calidad:
    name: Formato, análisis, tipos, unitarias, auditoría, compilación y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Formato, ESLint, tipos y pruebas unitarias
        run: npm run check
      - name: Auditoría de dependencias
        # Producción: cualquier aviso bloquea. Desarrollo: solo los críticos (ADR-0010).
        run: |
          npm audit --omit=dev
          npm audit --audit-level=critical
      - name: Esquema y conector válidos y SDK generado al día
        run: |
          npx --yes ${{ env.FIREBASE_TOOLS }} dataconnect:sdk:generate --project demo-tavelyo
          # Si el SDK guardado no coincide, cada bloque de la diferencia se publica como anotación
          # (los registros completos solo los ven los administradores del repositorio).
          if ! git diff --quiet -- packages/data-access/dataconnect-generated; then
            git diff --stat -- packages/data-access/dataconnect-generated
            git diff -U2 -- packages/data-access/dataconnect-generated | head -c 60000 \
              | awk 'BEGIN { RS = "\n@@"; n = 0 } { n++; if (n > 10) exit; gsub(/%/, "%25"); gsub(/\r/, "%0D"); gsub(/\n/, "%0A"); print "::error title=SDK generado distinto (" n ")::@@" $0 }'
            exit 1
          fi
      - name: Compilación de las dos PWA y del backend
        run: |
          npm run build -w @tavelyo/menu-web
          npm run build -w @tavelyo/operations
          npm run build -w @tavelyo/backend
      - name: Búsqueda de secretos (repositorio y builds)
        run: npm run check:secrets

  integracion:
    name: Autorización de conectores y backend contra emuladores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  navegadores:
    name: PWA, accesibilidad y recorridos del personal y del cliente (Playwright)
    runs-on: ubuntu-latest
    # Los recorridos con emuladores corren en los 5 navegadores de D-15: unos 42 minutos desde el
    # bloque 6 de la Fase 4 (la CI #73 tardó 44 min 51 s y la #74 se cortó a los 45).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Navegadores de la matriz D-15
        run: npx playwright install --with-deps chromium webkit chrome msedge
      - name: PWA y accesibilidad
        run: npm run test:e2e
      - name: Recorridos con emuladores y backend (5 navegadores)
        run: npm run test:e2e:emulators
      - name: Trazas de las pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7
