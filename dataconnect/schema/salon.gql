# Salón (Fase 2): sectores, mesas, sesiones de mesa y participantes (ADR-0011).
# Mismas reglas que schema.gql: FK compuestas con tenantId (y branchId en lo operativo), sin
# borrados de entidades con historia y archivado en lugar de borrado.

enum TableSessionStatus {
  OPEN
  CLOSED
}

"Sector del salón de una sucursal (terraza, salón principal, barra…)."
type Sector @table @unique(fields: ["id", "tenantId", "branchId"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenantId: UUID!
  branchId: UUID!
  branch: Branch! @ref(fields: ["branchId", "tenantId"], references: ["id", "tenantId"])
  name: String!
  sort: Int!
  archivedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

"""
Mesa. qrPublicId es el identificador aleatorio que lleva el QR impreso; rotarlo invalida los QR
anteriores (ADR-0011). El código es único por sucursal.
"""
type DiningTable
  @table
  @unique(fields: ["id", "tenantId", "branchId"])
  @unique(fields: ["tenantId", "branchId", "code"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenantId: UUID!
  branchId: UUID!
  sectorId: UUID!
  sector: Sector!
    @ref(fields: ["sectorId", "tenantId", "branchId"], references: ["id", "tenantId", "branchId"])
  code: String!
  seats: Int!
  qrPublicId: UUID! @unique @default(expr: "uuidV4()")
  archivedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

"""
Sesión de mesa: la abre el mesero (D-21) y la cierra el personal. openTableId vale el id de la
mesa mientras está abierta y null al cerrarla: su unicidad garantiza una sola sesión abierta por
mesa, incluso con dos meseros a la vez.
"""
type TableSession @table @unique(fields: ["id", "tenantId", "branchId"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenantId: UUID!
  branchId: UUID!
  tableId: UUID!
  table: DiningTable!
    @ref(fields: ["tableId", "tenantId", "branchId"], references: ["id", "tenantId", "branchId"])
  openTableId: UUID @unique
  status: TableSessionStatus!
  openedAt: Timestamp! @default(expr: "request.time")
  openedBy: String!
  closedAt: Timestamp
  closedBy: String
  "Sube con cada envío a cocina, aprobación o cierre: sirve de bloqueo de fila entre ellos (Fase 4, parte 4c)."
  version: Int! @default(value: 1)
}

"""
Cliente unido a una sesión desde su teléfono, con sesión anónima de Firebase Auth (ADR-0011).
Solo lo crea el backend; vence en expiresAt o al cerrar la sesión, y el personal puede expulsarlo.
"""
type SessionParticipant
  @table
  @unique(fields: ["sessionId", "authUid"])
  @unique(fields: ["sessionId", "guestNumber"])
  @unique(fields: ["id", "tenantId", "branchId"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenantId: UUID!
  branchId: UUID!
  sessionId: UUID!
  session: TableSession!
    @ref(fields: ["sessionId", "tenantId", "branchId"], references: ["id", "tenantId", "branchId"])
  authUid: String
  "Número de la persona sin teléfono dentro de esta sesión; carece de identidad de acceso."
  guestNumber: Int
  joinedAt: Timestamp! @default(expr: "request.time")
  expiresAt: Timestamp!
  removedAt: Timestamp
  removedBy: String
}

enum ServiceRequestKind {
  CALL_WAITER
  REQUEST_BILL
}

enum ServiceRequestStatus {
  PENDING
  ATTENDED
}

"""
Solicitud de un cliente al personal: «Llamar al mesero» o «Pedir la cuenta» (Fase 3). La crea
solo el backend, que aplica los límites (riesgo T11); el personal la marca como atendida. Pedir
la cuenta solo avisa al mesero: la cuenta es de la Fase 4.
"""
type ServiceRequest
  @table
  @unique(fields: ["id", "tenantId", "branchId"])
  @index(fields: ["tenantId", "branchId", "status", "createdAt"]) {
  id: UUID! @default(expr: "uuidV4()")
  tenantId: UUID!
  branchId: UUID!
  sessionId: UUID!
  session: TableSession!
    @ref(fields: ["sessionId", "tenantId", "branchId"], references: ["id", "tenantId", "branchId"])
  participantId: UUID!
  participant: SessionParticipant!
    @ref(
      fields: ["participantId", "tenantId", "branchId"]
      references: ["id", "tenantId", "branchId"]
    )
  kind: ServiceRequestKind!
  status: ServiceRequestStatus!
  """
  Vale «<sessionId>:<kind>» mientras está pendiente y null al atenderla: su unicidad deja una
  sola solicitud pendiente de cada tipo por mesa, así que repetirla no llena la lista del mesero.
  """
  pendingKey: String @unique
  createdAt: Timestamp! @default(expr: "request.time")
  attendedAt: Timestamp
  attendedBy: String
}
