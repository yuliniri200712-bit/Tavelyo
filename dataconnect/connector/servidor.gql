# Operaciones solo de servidor (ADR-0011): @auth(level: NO_ACCESS). Solo las ejecuta el Admin SDK
# del backend, después de sus propias comprobaciones; ningún cliente ni miembro del personal puede.
# Toda variable usada en un filtro es obligatoria: una variable omitida anula su filtro.

# Mesa de un QR con su sesión abierta, la participación de quien se une y cuántas hay vigentes.
# Nada si la mesa o su sector están archivados, la sucursal no está activa o la empresa está
# suspendida.
query ServerOpenSessionByQr($qrPublicId: UUID!, $authUid: String!) @auth(level: NO_ACCESS) {
  diningTables(
    where: {
      qrPublicId: { eq: $qrPublicId }
      archivedAt: { isNull: true }
      sector: {
        archivedAt: { isNull: true }
        branch: { status: { eq: ACTIVE }, tenant: { status: { eq: ACTIVE } } }
      }
    }
    limit: 1
  ) {
    id
    tenantId
    branchId
    code
    tableSessions_on_table(where: { status: { eq: OPEN } }, limit: 1) {
      id
      mine: sessionParticipants_on_session(where: { authUid: { eq: $authUid } }, limit: 1) {
        id
        expiresAt
        removedAt
      }
      active: sessionParticipants_on_session(
        where: { removedAt: { isNull: true }, expiresAt: { gt_expr: "request.time" } }
      ) {
        _count
      }
    }
  }
}

# Alta de un participante (lo decide joinTableSession), auditada con el uid anónimo del cliente.
mutation ServerInsertParticipant(
  $tenantId: UUID!
  $branchId: UUID!
  $sessionId: UUID!
  $authUid: String!
  $expiresAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  sessionParticipant_insert(
    data: {
      tenantId: $tenantId
      branchId: $branchId
      sessionId: $sessionId
      authUid: $authUid
      expiresAt: $expiresAt
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "session_participant.join"
      resourceType: "table_session"
      resourceId_expr: "vars.sessionId"
    }
  )
}

# Renueva la participación vencida de quien vuelve a escanear la mesa todavía abierta.
mutation ServerRenewParticipant($participantId: UUID!, $expiresAt: Timestamp!)
@auth(level: NO_ACCESS) {
  sessionParticipant_update(id: $participantId, data: { expiresAt: $expiresAt })
}

# Participación vigente de un cliente en una sesión abierta, con la sucursal de la mesa.
query ServerQuoteContext($sessionId: UUID!, $authUid: String!) @auth(level: NO_ACCESS) {
  sessionParticipants(
    where: {
      _and: [
        { sessionId: { eq: $sessionId } }
        { authUid: { eq: $authUid } }
        { removedAt: { isNull: true } }
        { expiresAt: { gt_expr: "request.time" } }
        { session: { status: { eq: OPEN } } }
      ]
    }
    limit: 1
  ) {
    id
    tenantId
    branchId
    session {
      table {
        sector {
          branch {
            currency
            timezone
            status
            tenant {
              status
            }
          }
        }
      }
    }
  }
}

# Productos pedidos, tal como están ahora en la sucursal (disponibilidad, horario, precio vigente,
# impuesto y opciones activas). El backend decide con esto; nunca con lo que envía el cliente.
query ServerProductsForQuote($branchId: UUID!, $productIds: [UUID!]!) @auth(level: NO_ACCESS) {
  productBranches(where: { branchId: { eq: $branchId }, productId: { in: $productIds } }) {
    productId
    available
    daysMask
    startMinute
    endMinute
    currentPrice {
      id
      amountMinor
      currency
    }
    product {
      name
      archivedAt
      category {
        archivedAt
      }
      taxRule {
        rateBp
        archivedAt
      }
      modifierGroups_on_product(where: { archivedAt: { isNull: true } }) {
        id
        minSelect
        maxSelect
        modifierOptions_on_group(where: { archivedAt: { isNull: true } }) {
          id
          name
          priceDeltaMinor
        }
      }
    }
  }
}

# Resumen ya guardado con la misma clave de idempotencia (doble pulsación o reintento).
query ServerQuoteByKey($participantId: UUID!, $idempotencyKey: String!) @auth(level: NO_ACCESS) {
  orderQuotes(
    where: { participantId: { eq: $participantId }, idempotencyKey: { eq: $idempotencyKey } }
    limit: 1
  ) {
    id
    fingerprint
    status
    currency
    subtotalMinor
    taxMinor
    totalMinor
    expiresAt
    orderQuoteLines_on_quote(orderBy: [{ position: ASC }]) {
      position
      productId
      priceId
      productNameSnapshot
      quantity
      unitPriceMinor
      modifiersSnapshot
      modifiersMinor
      lineTotalMinor
      taxMinor
      note
    }
  }
}

# El resumen con sus líneas lo guarda el backend con executeGraphql (documento fijo en
# backend/src/data/order-quotes.ts): el SDK web generado no admite listas de tipo _Data.

# Resumen de un cliente para enviarlo («Enviar pedido», ADR-0012): solo el suyo, con sus líneas y
# el modo de su sucursal (D-32). Devuelve el estado de la mesa y de la participación en lugar de
# filtrarlos, para responder por qué no se envió.
query ServerQuoteForSubmit($quoteId: UUID!, $authUid: String!) @auth(level: NO_ACCESS) {
  orderQuotes(
    where: { _and: [{ id: { eq: $quoteId } }, { participant: { authUid: { eq: $authUid } } }] }
    limit: 1
  ) {
    id
    tenantId
    branchId
    sessionId
    participantId
    status
    currency
    totalMinor
    expiresAt
    session {
      status
      table {
        sector {
          branch {
            orderApproval
          }
        }
      }
    }
    participant {
      removedAt
      expiresAt
    }
    orderQuoteLines_on_quote(orderBy: [{ position: ASC }]) {
      position
      productId
      priceId
      productNameSnapshot
      quantity
      unitPriceMinor
      modifiersSnapshot
      modifiersMinor
      lineTotalMinor
      taxMinor
      note
    }
  }
}

# Admite una solicitud si en la ventana hay menos de $limit admitidas; si no, la rechaza y la
# transacción se revierte (la rechazada no cuenta). El paso query no ve la fila que se inserta.
mutation ServerHitRateLimit($scope: String!, $subject: String!, $since: Timestamp!, $limit: Int!)
@auth(level: NO_ACCESS)
@transaction {
  rateLimitHit_insert(data: { scope: $scope, subject: $subject })
  query {
    rateLimitHits(where: { scope: { eq: $scope }, subject: { eq: $subject }, at: { gt: $since } })
      @check(expr: "this[0]._count < vars.limit", message: "Límite de solicitudes superado") {
      _count
    }
  }
}

# --- Fase 3: pedidos enviados a cocina y solicitudes de servicio ---

# Pedido ya creado para un resumen: un reintento lo reutiliza en lugar de crear otro (caso 3).
query ServerOrderByQuote($quoteId: UUID!) @auth(level: NO_ACCESS) {
  orders(where: { quoteId: { eq: $quoteId } }, limit: 1) {
    id
    sentToKitchenAt
    approval
  }
}

# Estación y alérgenos declarados de cada producto en la sucursal, y la estación predeterminada,
# para fijar la estación de cada línea y su instantánea de alérgenos al crear el pedido.
query ServerProductsForOrder($tenantId: UUID!, $branchId: UUID!, $productIds: [UUID!]!)
@auth(level: NO_ACCESS) {
  productBranches(
    where: {
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      productId: { in: $productIds }
    }
  ) {
    productId
    station {
      id
      archivedAt
    }
    product {
      allergensDeclared
    }
  }
  defaultStation: stations(
    where: { tenantId: { eq: $tenantId }, defaultForBranchId: { eq: $branchId } }
    limit: 1
  ) {
    id
  }
}

# Estación predeterminada de una sucursal que todavía no la tiene (la crea CreateBranch; esto
# cubre las sucursales anteriores a la Fase 3).
mutation ServerCreateDefaultStation($tenantId: UUID!, $branchId: UUID!) @auth(level: NO_ACCESS) {
  station_insert(
    data: {
      tenantId: $tenantId
      branchId: $branchId
      name: "Cocina"
      sort: 0
      defaultForBranchId: $branchId
    }
  )
}

# Envía a cocina un pedido que el backend ya guardó con sus líneas, en una sucursal que envía
# directo (D-32). Con aprobación del mesero, la puerta a cocina es ApproveOrder. Exige el resumen
# confirmado por su comensal (ADR-0012), la mesa abierta, la persona vigente en ella y el resumen
# sin vencer, todo en la misma transacción. Avisa a las pantallas por @refresh (ADR-0007).
mutation ServerSendOrderToKitchen(
  $tenantId: UUID!
  $branchId: UUID!
  $sessionId: UUID!
  $orderId: UUID!
  $authUid: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    order(id: $orderId) @check(expr: "this != null", message: "Pedido inexistente") {
      tenantId @check(expr: "this == vars.tenantId", message: "El pedido no es de la empresa")
      branchId @check(expr: "this == vars.branchId", message: "El pedido no es de la sucursal")
      sessionId @check(expr: "this == vars.sessionId", message: "El pedido no es de la mesa")
      sentToKitchenAt @check(expr: "this == null", message: "El pedido ya está en cocina")
      approval @check(expr: "this == 'NOT_REQUIRED'", message: "Este pedido lo aprueba el mesero")
      quote {
        status
          @check(
            expr: "this == 'CONFIRMED' || this == 'AUTHORIZED'"
            message: "El pedido no está confirmado"
          )
      }
    }
    valid: orders(
      where: {
        _and: [
          { id: { eq: $orderId } }
          { session: { status: { eq: OPEN } } }
          { quote: { expiresAt: { gt_expr: "request.time" } } }
          {
            participant: {
              authUid: { eq: $authUid }
              removedAt: { isNull: true }
              expiresAt: { gt_expr: "request.time" }
            }
          }
        ]
      }
    ) @check(expr: "this.size() == 1", message: "La mesa o la participación ya no están vigentes") {
      id
    }
  }
  # Bloquea la fila de la sesión (Fase 4, parte 4c): un cierre simultáneo espera o hace fallar esto.
  sessionLock: tableSession_updateMany(
    where: {
      id: { eq: $sessionId }
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      status: { eq: OPEN }
    }
    data: { version_update: { inc: 1 } }
  )
  lockedSession: query @redact {
    tableSession(id: $sessionId)
      @check(
        expr: "response.sessionLock == 1"
        message: "La mesa o la participación ya no están vigentes"
      ) {
      id
    }
  }
  order_update(id: $orderId, data: { sentToKitchenAt_expr: "request.time" })
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "order.send_to_kitchen"
      resourceType: "order"
      resourceId_expr: "vars.orderId"
    }
  )
}

# «Enviar pedido» (ADR-0012): el comensal confirma su resumen vigente; se suma a la cuenta de la
# mesa y se paga al final en el restaurante. Solo una vez: un reintento lo encuentra confirmado.
mutation ServerConfirmQuote($quoteId: UUID!, $tenantId: UUID!, $authUid: String!)
@auth(level: NO_ACCESS)
@transaction {
  orderQuote_updateMany(
    where: {
      id: { eq: $quoteId }
      tenantId: { eq: $tenantId }
      status: { eq: QUOTED }
      expiresAt: { gt_expr: "request.time" }
    }
    data: { status: CONFIRMED }
  )
  query @redact {
    orderQuote(id: $quoteId)
      @check(expr: "response.orderQuote_updateMany == 1", message: "El resumen ya cambió") {
      id
    }
  }
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "order_quote.confirm"
      resourceType: "order_quote"
      resourceId_expr: "vars.quoteId"
    }
  )
}

# Sucursal con aprobación del mesero (D-32): el pedido guardado queda PENDING y aparece en la bandeja
# «Pedidos por aprobar». Mismas comprobaciones que el envío directo; solo una vez por pedido.
mutation ServerRequestOrderApproval(
  $tenantId: UUID!
  $branchId: UUID!
  $sessionId: UUID!
  $orderId: UUID!
  $authUid: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    order(id: $orderId) @check(expr: "this != null", message: "Pedido inexistente") {
      tenantId @check(expr: "this == vars.tenantId", message: "El pedido no es de la empresa")
      branchId @check(expr: "this == vars.branchId", message: "El pedido no es de la sucursal")
      sessionId @check(expr: "this == vars.sessionId", message: "El pedido no es de la mesa")
      sentToKitchenAt @check(expr: "this == null", message: "El pedido ya está en cocina")
      quote {
        status @check(expr: "this == 'CONFIRMED'", message: "El pedido no está confirmado")
      }
    }
    valid: orders(
      where: {
        _and: [
          { id: { eq: $orderId } }
          { session: { status: { eq: OPEN } } }
          {
            participant: {
              authUid: { eq: $authUid }
              removedAt: { isNull: true }
              expiresAt: { gt_expr: "request.time" }
            }
          }
        ]
      }
    ) @check(expr: "this.size() == 1", message: "La mesa o la participación ya no están vigentes") {
      id
    }
  }
  # Bloquea la fila de la sesión (Fase 4, parte 4c): un cierre simultáneo espera o hace fallar esto.
  sessionLock: tableSession_updateMany(
    where: {
      id: { eq: $sessionId }
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      status: { eq: OPEN }
    }
    data: { version_update: { inc: 1 } }
  )
  lockedSession: query @redact {
    tableSession(id: $sessionId)
      @check(
        expr: "response.sessionLock == 1"
        message: "La mesa o la participación ya no están vigentes"
      ) {
      id
    }
  }
  order_updateMany(
    where: { id: { eq: $orderId }, approval: { eq: NOT_REQUIRED } }
    data: { approval: PENDING, approvalRequestedAt_expr: "request.time" }
  )
  applied: query @redact {
    order(id: $orderId)
      @check(expr: "response.order_updateMany == 1", message: "La aprobación ya se pidió") {
      id
    }
  }
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "order.request_approval"
      resourceType: "order"
      resourceId_expr: "vars.orderId"
    }
  )
}

# Solicitud de servicio (la decide requestService, con sus límites). pendingKey («<sesión>:<tipo>») es único: si ya hay
# una pendiente del mismo tipo en la mesa, la inserción falla y el backend responde que el aviso
# ya está hecho.
mutation ServerCreateServiceRequest(
  $tenantId: UUID!
  $branchId: UUID!
  $sessionId: UUID!
  $participantId: UUID!
  $authUid: String!
  $kind: ServiceRequestKind!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    sessionParticipants(
      where: {
        _and: [
          { id: { eq: $participantId } }
          { tenantId: { eq: $tenantId } }
          { branchId: { eq: $branchId } }
          { sessionId: { eq: $sessionId } }
          { authUid: { eq: $authUid } }
          { removedAt: { isNull: true } }
          { expiresAt: { gt_expr: "request.time" } }
          { session: { status: { eq: OPEN } } }
        ]
      }
    ) @check(expr: "this.size() == 1", message: "La mesa o la participación ya no están vigentes") {
      id
    }
  }
  serviceRequest_insert(
    data: {
      tenantId: $tenantId
      branchId: $branchId
      sessionId: $sessionId
      participantId: $participantId
      kind: $kind
      status: PENDING
      pendingKey_expr: "vars.sessionId + ':' + vars.kind"
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "service_request.create"
      resourceType: "service_request"
      resourceId_expr: "response.serviceRequest_insert.id"
    }
  )
}

# Cierre de mesa (D-30, Fase 4 parte 4c). El backend comprueba antes saldo cero, todo entregado y
# ningún pedido por aprobar; estas operaciones lo repiten dentro de la transacción para que un pedido
# o un pago simultáneo no se cuele. Se vuelve a comprobar el permiso de quien cierra (revocación).
# Dos variantes fijas: sin cuenta (mesa sin consumo) y con la cuenta, que queda saldada.

# Mesa sin cuenta: no puede tener nada que se cobre ni pedidos por aprobar.
mutation ServerCloseTableSession(
  $tenantId: UUID!
  $branchId: UUID!
  $sessionId: UUID!
  $authUid: String!
) @auth(level: NO_ACCESS) @transaction {
  tableSession_updateMany(
    where: {
      id: { eq: $sessionId }
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      status: { eq: OPEN }
    }
    data: {
      status: CLOSED
      version_update: { inc: 1 }
      openTableId: null
      closedAt_expr: "request.time"
      closedBy: $authUid
    }
  )
  closed: query @redact {
    tableSession(id: $sessionId)
      @check(expr: "response.tableSession_updateMany == 1", message: "La mesa ya cambió") {
      id
    }
  }
  query @redact {
    membership(key: { tenantId: $tenantId, userId: $authUid })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      role {
        rolePermissions_on_role(where: { permission: { code: { eq: "session.close" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: session.close") {
          permission {
            code
          }
        }
      }
    }
    bills(where: { sessionId: { eq: $sessionId } }, limit: 1)
      @check(expr: "this.size() == 0", message: "La cuenta de la mesa cambió") {
      id
    }
    pending: orderItems(
      where: {
        _and: [
          { tenantId: { eq: $tenantId } }
          { branchId: { eq: $branchId } }
          { status: { ne: CANCELLED } }
          { order: { sessionId: { eq: $sessionId } } }
          {
            _or: [
              {
                order: {
                  sentToKitchenAt: { isNull: false }
                  approval: { in: [NOT_REQUIRED, APPROVED] }
                }
              }
              { order: { approval: { eq: PENDING } } }
            ]
          }
        ]
      }
      limit: 1
    ) @check(expr: "this.size() == 0", message: "La cuenta de la mesa cambió") {
      id
    }
  }
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "table_session.close"
      resourceType: "table_session"
      resourceId_expr: "vars.sessionId"
    }
  )
}

# Mesa con cuenta: la cuenta en la versión leída por el backend, sin líneas en cocina o por entregar
# y sin pedidos por aprobar. La cuenta queda saldada con su total como instantánea.
mutation ServerCloseSettledTableSession(
  $tenantId: UUID!
  $branchId: UUID!
  $sessionId: UUID!
  $authUid: String!
  $billId: UUID!
  $billVersion: Int!
  $totalMinor: Int64!
) @auth(level: NO_ACCESS) @transaction {
  tableSession_updateMany(
    where: {
      id: { eq: $sessionId }
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      status: { eq: OPEN }
    }
    data: {
      status: CLOSED
      version_update: { inc: 1 }
      openTableId: null
      closedAt_expr: "request.time"
      closedBy: $authUid
    }
  )
  closed: query @redact {
    tableSession(id: $sessionId)
      @check(expr: "response.tableSession_updateMany == 1", message: "La mesa ya cambió") {
      id
    }
  }
  query @redact {
    membership(key: { tenantId: $tenantId, userId: $authUid })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      role {
        rolePermissions_on_role(where: { permission: { code: { eq: "session.close" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: session.close") {
          permission {
            code
          }
        }
      }
    }
    pending: orderItems(
      where: {
        _and: [
          { tenantId: { eq: $tenantId } }
          { branchId: { eq: $branchId } }
          { status: { in: [RECEIVED, IN_PREPARATION, READY, PICKED_UP] } }
          { order: { sessionId: { eq: $sessionId } } }
          {
            _or: [
              {
                order: {
                  sentToKitchenAt: { isNull: false }
                  approval: { in: [NOT_REQUIRED, APPROVED] }
                }
              }
              { order: { approval: { eq: PENDING } } }
            ]
          }
        ]
      }
      limit: 1
    ) @check(expr: "this.size() == 0", message: "La cuenta de la mesa cambió") {
      id
    }
    waiting: orders(
      where: {
        _and: [
          { tenantId: { eq: $tenantId } }
          { sessionId: { eq: $sessionId } }
          { approval: { eq: PENDING } }
        ]
      }
      limit: 1
    ) @check(expr: "this.size() == 0", message: "La cuenta de la mesa cambió") {
      id
    }
  }
  bill_updateMany(
    where: {
      id: { eq: $billId }
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      sessionId: { eq: $sessionId }
      version: { eq: $billVersion }
      status: { eq: OPEN }
    }
    data: {
      status: SETTLED
      version_update: { inc: 1 }
      settledTotalMinor: $totalMinor
      settledAt_expr: "request.time"
      settledBy: $authUid
    }
  )
  settled: query @redact {
    bill(id: $billId)
      @check(expr: "response.bill_updateMany == 1", message: "La cuenta de la mesa cambió") {
      id
    }
  }
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "table_session.close"
      resourceType: "table_session"
      resourceId_expr: "vars.sessionId"
    }
  )
  settleAudit: auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId: $authUid
      operation: "bill.settle"
      resourceType: "bill"
      resourceId_expr: "vars.billId"
    }
  )
}
