# Pedidos y solicitudes para el personal del salón (Fase 3). Mismo patrón que cocina.gql: permiso,
# sucursal asignada, pertenencia de los recursos, cambio de estado condicionado por estado y
# versión (caso 4), AuditEvent en la misma transacción y refresco por sucursal (ADR-0007).
# Toda variable usada en un filtro es obligatoria: una variable omitida anula su filtro.

# «Listos para recoger»: líneas listas o recogidas de la sucursal, de la más antigua a la más
# reciente, con su mesa y su estación. Sin importes.
query PickupQueue($tenantId: UUID!, $branchId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "FinishOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "PickUpOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeliverOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeliverOrderItemDirectly"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "CancelOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
) {
  membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
    status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
    tenant {
      status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
    }
    role {
      code
      rolePermissions_on_role(where: { permission: { code: { eq: "delivery.pickup" } } })
        @check(expr: "this.size() > 0", message: "Sin permiso: delivery.pickup") {
        permission {
          code
        }
      }
    }
  }
  actorBranch: membershipBranch(
    key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
  )
    @redact
    @check(
      expr: "this != null || response.membership.role.code == 'tenant_owner'"
      message: "Sin acceso a la sucursal"
    ) {
    branchId
  }
  orderItems(
    where: {
      _and: [
        { tenantId: { eq: $tenantId } }
        { branchId: { eq: $branchId } }
        { status: { in: [READY, PICKED_UP] } }
      ]
    }
    orderBy: [{ readyAt: ASC }, { position: ASC }]
    limit: 200
  ) {
    id
    version
    status
    quantity
    productNameSnapshot
    note
    readyAt
    pickedUpAt
    orderItemModifiers_on_item(orderBy: [{ position: ASC }]) {
      nameSnapshot
    }
    station {
      name
    }
    order {
      session {
        id
        table {
          code
        }
      }
    }
  }
}

# Pedidos enviados a cocina de una mesa, con el estado de cada línea (para seguirlos y cancelar).
query SessionOrders($tenantId: UUID!, $branchId: UUID!, $sessionId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "ServerSendOrderToKitchen"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "ApproveOrder"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StartOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "PickUpOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeliverOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeliverOrderItemDirectly"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "CancelOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
) {
  membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
    status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
    tenant {
      status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
    }
    role {
      code
      rolePermissions_on_role(where: { permission: { code: { eq: "session.open" } } })
        @check(expr: "this.size() > 0", message: "Sin permiso: session.open") {
        permission {
          code
        }
      }
    }
  }
  actorBranch: membershipBranch(
    key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
  )
    @redact
    @check(
      expr: "this != null || response.membership.role.code == 'tenant_owner'"
      message: "Sin acceso a la sucursal"
    ) {
    branchId
  }
  orders(
    where: {
      _and: [
        { tenantId: { eq: $tenantId } }
        { branchId: { eq: $branchId } }
        { sessionId: { eq: $sessionId } }
        { sentToKitchenAt: { isNull: false } }
      ]
    }
    orderBy: [{ sentToKitchenAt: ASC }]
  ) {
    id
    sentToKitchenAt
    orderItems_on_order(orderBy: [{ position: ASC }]) {
      id
      version
      status
      quantity
      productNameSnapshot
      note
      cancelReason
      orderItemModifiers_on_item(orderBy: [{ position: ASC }]) {
        nameSnapshot
      }
    }
  }
}

# «Recogido»: el mesero toma la línea lista.
mutation PickUpOrderItem($tenantId: UUID!, $branchId: UUID!, $itemId: UUID!, $version: Int!)
@auth(level: USER)
@transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        code
        rolePermissions_on_role(where: { permission: { code: { eq: "delivery.pickup" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: delivery.pickup") {
          permission {
            code
          }
        }
      }
    }
    actorBranch: membershipBranch(
      key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
    )
      @check(
        expr: "this != null || response.query.membership.role.code == 'tenant_owner'"
        message: "Sin acceso a la sucursal"
      ) {
      branchId
    }
    orderItem(id: $itemId) @check(expr: "this != null", message: "Línea inexistente") {
      tenantId @check(expr: "this == vars.tenantId", message: "La línea no pertenece a la empresa")
      branchId @check(expr: "this == vars.branchId", message: "La línea no pertenece a la sucursal")
      version @check(expr: "this == vars.version", message: "Esta línea ya cambió")
      status @check(expr: "this == 'READY'", message: "Esta línea ya cambió")
    }
  }
  orderItem_updateMany(
    where: { id: { eq: $itemId }, version: { eq: $version }, status: { eq: READY } }
    data: { status: PICKED_UP, version_update: { inc: 1 }, pickedUpAt_expr: "request.time" }
  )
  applied: query @redact {
    orderItem(id: $itemId)
      @check(expr: "response.orderItem_updateMany == 1", message: "Esta línea ya cambió") {
      id
    }
  }
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "order_item.pick_up"
      resourceType: "order_item"
      resourceId_expr: "vars.itemId"
    }
  )
}

# «Entregado»: la línea recogida llega a la mesa.
