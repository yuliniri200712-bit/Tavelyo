# Gestión de la carta (Fase 2).
# - Catálogo de la empresa (categorías, productos, modificadores): catalog.manage y propietario. El
#   catalog.manage del administrador de sucursal es «catálogo local» (permissions.md): disponibilidad
#   y horario en sus sucursales.
# - Impuestos: tenant.settings (D-01b: la tasa la decide la empresa con su contador).
# - Precio por sucursal: price.change en una sucursal asignada (salvo propietario); cada cambio
#   inserta una versión nueva de Price y la marca como vigente en la misma transacción.
# Archivar en lugar de borrar: archived = true archiva y false restaura. Las operaciones de edición
# esperan todos los campos (un opcional enviado como null lo vacía). Toda variable usada en un
# filtro es obligatoria, salvo donde la expresión de @check descarta antes la variable nula.

# Catálogo completo de la empresa, archivados incluidos, con sus impuestos.
query CatalogAdmin($tenantId: UUID!) @auth(level: USER) {
  membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
    status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
    tenant {
      status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
    }
    role {
      rolePermissions_on_role(
        where: { permission: { code: { in: ["catalog.manage", "price.change"] } } }
      ) @check(expr: "this.size() > 0", message: "Sin permiso: catalog.manage") {
        permission {
          code
        }
      }
    }
  }
  taxRules(where: { tenantId: { eq: $tenantId } }, orderBy: [{ name: ASC }]) {
    id
    name
    rateBp
    archivedAt
  }
  categories(where: { tenantId: { eq: $tenantId } }, orderBy: [{ sort: ASC }, { name: ASC }]) {
    id
    name
    sort
    archivedAt
    products_on_category(orderBy: [{ sort: ASC }, { name: ASC }]) {
      id
      name
      description
      allergensDeclared
      sort
      taxRuleId
      archivedAt
      modifierGroups_on_product(orderBy: [{ sort: ASC }]) {
        id
        name
        minSelect
        maxSelect
        sort
        archivedAt
        modifierOptions_on_group(orderBy: [{ sort: ASC }]) {
          id
          name
          priceDeltaMinor
          sort
          archivedAt
        }
      }
    }
  }
}

# Disponibilidad, horario y precio vigente de los productos en una sucursal.
query BranchCatalog($tenantId: UUID!, $branchId: UUID!) @auth(level: USER) {
  membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
    status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
    tenant {
      status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
    }
    role {
      code
      rolePermissions_on_role(
        where: { permission: { code: { in: ["catalog.manage", "price.change"] } } }
      ) @check(expr: "this.size() > 0", message: "Sin permiso: catalog.manage") {
        permission {
          code
        }
      }
    }
  }
  actorBranch: membershipBranch(
    key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
  )
    @redact
    @check(
      expr: "this != null || response.membership.role.code == 'tenant_owner'"
      message: "Sin acceso a la sucursal"
    ) {
    branchId
  }
  productBranches(where: { tenantId: { eq: $tenantId }, branchId: { eq: $branchId } }) {
    productId
    stationId
    available
    daysMask
    startMinute
    endMinute
    currentPrice {
      id
      amountMinor
      currency
      validFrom
    }
  }
}

mutation CreateTaxRule($tenantId: UUID!, $name: String!, $rateBp: Int!)
@auth(level: USER)
@transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa")
      @check(
        expr: "size(vars.name.trim()) >= 1 && size(vars.name) <= 60 && vars.rateBp >= 0 && vars.rateBp <= 10000"
        message: "Datos del impuesto no válidos"
      ) {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        rolePermissions_on_role(where: { permission: { code: { eq: "tenant.settings" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: tenant.settings") {
          permission {
            code
          }
        }
      }
    }
  }
  taxRule_insert(data: { tenantId: $tenantId, name: $name, rateBp: $rateBp })
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "tax_rule.create"
      resourceType: "tax_rule"
      resourceId_expr: "response.taxRule_insert.id"
    }
  )
}

# Edita, archiva o restaura un impuesto. Solo se archiva si ningún producto activo lo usa. Los
# resúmenes de pedido ya calculados conservan la tasa con la que se calcularon.
mutation UpdateTaxRule(
  $tenantId: UUID!
  $taxRuleId: UUID!
  $name: String!
  $rateBp: Int!
  $archived: Boolean!
) @auth(level: USER) @transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa")
      @check(
        expr: "size(vars.name.trim()) >= 1 && size(vars.name) <= 60 && vars.rateBp >= 0 && vars.rateBp <= 10000"
        message: "Datos del impuesto no válidos"
      ) {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        rolePermissions_on_role(where: { permission: { code: { eq: "tenant.settings" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: tenant.settings") {
          permission {
            code
          }
        }
      }
    }
    taxRule(id: $taxRuleId) @check(expr: "this != null", message: "Impuesto inexistente") {
      tenantId
        @check(expr: "this == vars.tenantId", message: "El impuesto no pertenece a la empresa")
      products_on_taxRule(where: { archivedAt: { isNull: true } })
        @check(
          expr: "!vars.archived || this.size() == 0"
          message: "El impuesto está en uso por productos activos"
        ) {
        id
      }
    }
  }
  taxRule_update(
    id: $taxRuleId
    data: { name: $name, rateBp: $rateBp, archivedAt_expr: "vars.archived ? request.time : null" }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation_expr: "vars.archived ? 'tax_rule.archive' : 'tax_rule.update'"
      resourceType: "tax_rule"
      resourceId_expr: "vars.taxRuleId"
    }
  )
}

