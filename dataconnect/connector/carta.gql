        rolePermissions_on_role(where: { permission: { code: { eq: "catalog.manage" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: catalog.manage") {
          permission {
            code
          }
        }
      }
    }
    modifierGroup(id: $groupId)
      @check(expr: "this != null", message: "Grupo de opciones inexistente") {
      tenantId @check(expr: "this == vars.tenantId", message: "El grupo no pertenece a la empresa")
      archivedAt @check(expr: "this == null", message: "El grupo está archivado")
