      role {
        code
          @check(
            expr: "this == 'tenant_owner'"
            message: "Solo el propietario gestiona el catálogo de la empresa"
          )
        rolePermissions_on_role(where: { permission: { code: { eq: "catalog.manage" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: catalog.manage") {
          permission {
            code
          }
        }
      }
    }
    modifierOption(id: $optionId) @check(expr: "this != null", message: "Opción inexistente") {
      tenantId @check(expr: "this == vars.tenantId", message: "La opción no pertenece a la empresa")
    }
  }
  modifierOption_update(
    id: $optionId
    data: {
      name: $name
      priceDeltaMinor: $priceDeltaMinor
      sort: $sort
      archivedAt_expr: "vars.archived ? request.time : null"
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation_expr: "vars.archived ? 'modifier_option.archive' : 'modifier_option.update'"
      resourceType: "modifier_option"
      resourceId_expr: "vars.optionId"
    }
  )
}

# Disponibilidad y horario de un producto en una sucursal. Horario: los tres campos nulos (todo el
# día, todos los días) o los tres definidos; endMinute < startMinute cruza la medianoche.
mutation SetProductAvailability(
  $tenantId: UUID!
  $branchId: UUID!
  $productId: UUID!
  $available: Boolean!
  $daysMask: Int
  $startMinute: Int
  $endMinute: Int
) @auth(level: USER) @transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa")
      @check(
        expr: "has(vars.daysMask) && has(vars.startMinute) && has(vars.endMinute) && ((vars.daysMask == null && vars.startMinute == null && vars.endMinute == null) || (vars.daysMask != null && vars.startMinute != null && vars.endMinute != null && vars.daysMask >= 1 && vars.daysMask <= 127 && vars.startMinute >= 0 && vars.startMinute <= 1439 && vars.endMinute >= 0 && vars.endMinute <= 1440 && vars.startMinute != vars.endMinute))"
        message: "Horario no válido"
      ) {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        code
        rolePermissions_on_role(where: { permission: { code: { eq: "catalog.manage" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: catalog.manage") {
          permission {
            code
          }
        }
      }
    }
    actorBranch: membershipBranch(
      key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
    )
      @check(
        expr: "this != null || response.query.membership.role.code == 'tenant_owner'"
        message: "Sin acceso a la sucursal"
      ) {
      branchId
    }
    branch(id: $branchId) @check(expr: "this != null", message: "Sucursal inexistente") {
      tenantId
        @check(expr: "this == vars.tenantId", message: "La sucursal no pertenece a la empresa")
      status @check(expr: "this == 'ACTIVE'", message: "La sucursal no está activa")
    }
    product(id: $productId) @check(expr: "this != null", message: "Producto inexistente") {
      tenantId
        @check(expr: "this == vars.tenantId", message: "El producto no pertenece a la empresa")
      archivedAt
        @check(expr: "!vars.available || this == null", message: "El producto está archivado")
    }
  }
  productBranch_upsert(
    data: {
      tenantId: $tenantId
      branchId: $branchId
      productId: $productId
      available: $available
      daysMask: $daysMask
      startMinute: $startMinute
      endMinute: $endMinute
      updatedAt_expr: "request.time"
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "product_branch.availability"
      resourceType: "product"
      resourceId_expr: "vars.productId"
    }
  )
}

# Precio nuevo de un producto en una sucursal, con impuestos incluidos (D-01b), en unidades menores
# y en la moneda de la sucursal. El historial queda en Price; el carrito abierto con el precio
# anterior exige confirmar el nuevo importe (caso 5, en quoteOrder).
mutation ChangePrice(
  $tenantId: UUID!
  $branchId: UUID!
  $productId: UUID!
  $amountMinor: Int64!
  $currency: String!
) @auth(level: USER) @transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa")
      @check(
        expr: "vars.amountMinor > 0 && vars.amountMinor <= 100000000000"
        message: "Precio no válido"
      ) {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        code
        rolePermissions_on_role(where: { permission: { code: { eq: "price.change" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: price.change") {
          permission {
            code
          }
        }
      }
    }
    actorBranch: membershipBranch(
      key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
    )
      @check(
        expr: "this != null || response.query.membership.role.code == 'tenant_owner'"
        message: "Sin acceso a la sucursal"
      ) {
      branchId
    }
    branch(id: $branchId) @check(expr: "this != null", message: "Sucursal inexistente") {
      tenantId
        @check(expr: "this == vars.tenantId", message: "La sucursal no pertenece a la empresa")
      status @check(expr: "this == 'ACTIVE'", message: "La sucursal no está activa")
      currency @check(expr: "this == vars.currency", message: "La moneda no es la de la sucursal")
    }
    productBranch(key: { productId: $productId, branchId: $branchId })
      @check(expr: "this != null", message: "Primero agrega el producto a la sucursal") {
      tenantId
        @check(expr: "this == vars.tenantId", message: "El producto no pertenece a la empresa")
      product {
        archivedAt @check(expr: "this == null", message: "El producto está archivado")
      }
    }
  }
  price_insert(
    data: {
      tenantId: $tenantId
      branchId: $branchId
      productId: $productId
      amountMinor: $amountMinor
      currency: $currency
      createdBy_expr: "auth.uid"
    }
  )
  productBranch_update(
    key: { productId: $productId, branchId: $branchId }
    data: { currentPriceId_expr: "response.price_insert.id", updatedAt_expr: "request.time" }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "price.change"
      resourceType: "product"
      resourceId_expr: "vars.productId"
    }
  )
}
