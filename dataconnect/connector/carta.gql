# Alérgenos: información declarada por el restaurante; la app nunca garantiza su ausencia.
mutation CreateProduct(
  $tenantId: UUID!
  $categoryId: UUID!
  $taxRuleId: UUID
  $name: String!
  $description: String
  $allergensDeclared: [String!]
  $sort: Int!
) @auth(level: USER) @transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa")
      @check(
        expr: "size(vars.name.trim()) >= 1 && size(vars.name) <= 80 && vars.sort >= 0 && (!has(vars.description) || vars.description == null || size(vars.description) <= 500) && (!has(vars.allergensDeclared) || vars.allergensDeclared == null || (size(vars.allergensDeclared) <= 20 && vars.allergensDeclared.all(a, size(a.trim()) >= 1 && size(a) <= 40)))"
        message: "Datos del producto no válidos"
      ) {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        code
          @check(
            expr: "this == 'tenant_owner'"
            message: "Solo el propietario gestiona el catálogo de la empresa"
          )
        rolePermissions_on_role(where: { permission: { code: { eq: "catalog.manage" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: catalog.manage") {
          permission {
            code
          }
        }
      }
    }
    category(id: $categoryId) @check(expr: "this != null", message: "Categoría inexistente") {
      tenantId
        @check(expr: "this == vars.tenantId", message: "La categoría no pertenece a la empresa")
      archivedAt @check(expr: "this == null", message: "La categoría está archivada")
    }
    # Con taxRuleId nulo el filtro por id desaparece; la expresión lo descarta antes de mirar la lista.
    taxRules(
      where: {
        _and: [
          { id: { eq: $taxRuleId } }
          { tenantId: { eq: $tenantId } }
          { archivedAt: { isNull: true } }
        ]
      }
    )
      @check(
        expr: "!has(vars.taxRuleId) || vars.taxRuleId == null || this.size() == 1"
        message: "Impuesto inexistente o archivado"
      ) {
      id
    }
  }
  product_insert(
    data: {
      tenantId: $tenantId
      categoryId: $categoryId
      taxRuleId: $taxRuleId
      name: $name
      description: $description
      allergensDeclared: $allergensDeclared
      sort: $sort
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "product.create"
      resourceType: "product"
      resourceId_expr: "response.product_insert.id"
    }
  )
}

