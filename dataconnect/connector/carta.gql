  }
  modifierOption_insert(
    data: {
      tenantId: $tenantId
      groupId: $groupId
      name: $name
      priceDeltaMinor: $priceDeltaMinor
      sort: $sort
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
