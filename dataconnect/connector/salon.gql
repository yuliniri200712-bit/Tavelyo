# Operaciones del salón para el personal (Fase 2). Mismo patrón que mutations.gql (ADR-0008):
# membresía activa, empresa activa, permiso, sucursal asignada (salvo propietario), pertenencia de
# los recursos a la empresa y a la sucursal, y AuditEvent en la misma transacción.
# Toda variable usada en un filtro es obligatoria: una variable omitida anula su filtro.

# Vista del salón para meseros: sectores y mesas activas con su sesión abierta, si la hay, sus
# líneas en curso y sus solicitudes pendientes (Fase 3). No incluye el qrPublicId (solo lo ve
# quien gestiona las mesas). Se refresca sola con cada cambio de la sucursal (ADR-0007).
query FloorView($tenantId: UUID!, $branchId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "OpenTableSession"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "CloseTableSession"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "ServerSendOrderToKitchen"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "PickUpOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeliverOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeliverOrderItemDirectly"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "CancelOrderItem"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "ServerCreateServiceRequest"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "AttendServiceRequest"
    condition: "request.variables.branchId == mutation.variables.branchId"
  }
) {
  membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
    status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
    tenant {
      status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
    }
    role {
      code
      rolePermissions_on_role(where: { permission: { code: { eq: "session.open" } } })
        @check(expr: "this.size() > 0", message: "Sin permiso: session.open") {
        permission {
          code
        }
      }
    }
  }
  actorBranch: membershipBranch(
    key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
  )
    @redact
    @check(
      expr: "this != null || response.membership.role.code == 'tenant_owner'"
      message: "Sin acceso a la sucursal"
    ) {
    branchId
  }
  sectors(
    where: {
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      archivedAt: { isNull: true }
    }
    orderBy: [{ sort: ASC }, { name: ASC }]
  ) {
    id
    name
    diningTables_on_sector(where: { archivedAt: { isNull: true } }, orderBy: [{ code: ASC }]) {
      id
      code
      seats
      tableSessions_on_table(where: { status: { eq: OPEN } }, limit: 1) {
        id
        openedAt
        orders_on_session(where: { sentToKitchenAt: { isNull: false } }) {
          orderItems_on_order(
            where: { status: { in: [RECEIVED, IN_PREPARATION, READY, PICKED_UP] } }
          ) {
            status
          }
        }
        serviceRequests_on_session(where: { status: { eq: PENDING } }) {
          kind
          createdAt
        }
      }
    }
  }
}

# Participantes de una sesión (para que el mesero vea quién se unió y pueda expulsar). No devuelve
# el uid de Firebase Auth de los clientes.
query SessionParticipants($tenantId: UUID!, $branchId: UUID!, $sessionId: UUID!)
@auth(level: USER) {
  membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
    status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
    tenant {
      status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
    }
    role {
      code
      rolePermissions_on_role(where: { permission: { code: { eq: "session.open" } } })
        @check(expr: "this.size() > 0", message: "Sin permiso: session.open") {
        permission {
          code
        }
      }
    }
  }
  actorBranch: membershipBranch(
    key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
  )
    @redact
    @check(
      expr: "this != null || response.membership.role.code == 'tenant_owner'"
      message: "Sin acceso a la sucursal"
    ) {
    branchId
  }
  sessionParticipants(
    where: {
      tenantId: { eq: $tenantId }
      branchId: { eq: $branchId }
      sessionId: { eq: $sessionId }
    }
    orderBy: [{ joinedAt: ASC }]
  ) {
    id
    joinedAt
    expiresAt
    removedAt
  }
}

# Abre la mesa (D-21). La unicidad de openTableId impide dos sesiones abiertas en la misma mesa.
mutation OpenTableSession($tenantId: UUID!, $branchId: UUID!, $tableId: UUID!)
@auth(level: USER)
@transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        code
        rolePermissions_on_role(where: { permission: { code: { eq: "session.open" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: session.open") {
          permission {
            code
          }
        }
      }
    }
    actorBranch: membershipBranch(
      key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
    )
      @check(
        expr: "this != null || response.query.membership.role.code == 'tenant_owner'"
        message: "Sin acceso a la sucursal"
      ) {
      branchId
    }
    diningTable(id: $tableId) @check(expr: "this != null", message: "Mesa inexistente") {
      tenantId @check(expr: "this == vars.tenantId", message: "La mesa no pertenece a la empresa")
      branchId @check(expr: "this == vars.branchId", message: "La mesa no pertenece a la sucursal")
      archivedAt @check(expr: "this == null", message: "La mesa está archivada")
      sector {
        archivedAt @check(expr: "this == null", message: "El sector está archivado")
        branch {
          status @check(expr: "this == 'ACTIVE'", message: "La sucursal no está activa")
        }
      }
    }
  }
  tableSession_insert(
    data: {
      tenantId: $tenantId
      branchId: $branchId
      tableId: $tableId
      openTableId: $tableId
      status: OPEN
      openedBy_expr: "auth.uid"
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "table_session.open"
      resourceType: "dining_table"
      resourceId_expr: "vars.tableId"
    }
  )
}

# Cierra la sesión: sus participantes pierden el acceso y la mesa queda libre (caso 12).
mutation CloseTableSession($tenantId: UUID!, $branchId: UUID!, $sessionId: UUID!)
@auth(level: USER)
@transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        code
        rolePermissions_on_role(where: { permission: { code: { eq: "session.close" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: session.close") {
          permission {
            code
          }
        }
      }
    }
    actorBranch: membershipBranch(
      key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
    )
      @check(
        expr: "this != null || response.query.membership.role.code == 'tenant_owner'"
        message: "Sin acceso a la sucursal"
      ) {
      branchId
    }
    tableSession(id: $sessionId) @check(expr: "this != null", message: "Sesión inexistente") {
      tenantId @check(expr: "this == vars.tenantId", message: "La sesión no pertenece a la empresa")
      branchId
        @check(expr: "this == vars.branchId", message: "La sesión no pertenece a la sucursal")
      status @check(expr: "this == 'OPEN'", message: "La sesión ya está cerrada")
    }
  }
  tableSession_update(
    id: $sessionId
    data: {
      status: CLOSED
      openTableId: null
      closedAt_expr: "request.time"
      closedBy_expr: "auth.uid"
    }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "table_session.close"
      resourceType: "table_session"
      resourceId_expr: "vars.sessionId"
    }
  )
}

# Expulsa a un participante (riesgo T11 de ADR-0011): pierde el acceso a la sesión al instante.
mutation RemoveParticipant($tenantId: UUID!, $branchId: UUID!, $participantId: UUID!)
@auth(level: USER)
@transaction {
  query @redact {
    membership(key: { tenantId: $tenantId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "Sin membresía activa en la empresa") {
      status @check(expr: "this == 'ACTIVE'", message: "Sin membresía activa en la empresa")
      tenant {
        status @check(expr: "this == 'ACTIVE'", message: "Empresa suspendida")
      }
      role {
        code
        rolePermissions_on_role(where: { permission: { code: { eq: "session.close" } } })
          @check(expr: "this.size() > 0", message: "Sin permiso: session.close") {
          permission {
            code
          }
        }
      }
    }
    actorBranch: membershipBranch(
      key: { tenantId: $tenantId, userId_expr: "auth.uid", branchId: $branchId }
    )
      @check(
        expr: "this != null || response.query.membership.role.code == 'tenant_owner'"
        message: "Sin acceso a la sucursal"
      ) {
      branchId
    }
    sessionParticipant(id: $participantId)
      @check(expr: "this != null", message: "Participante inexistente") {
      tenantId
        @check(expr: "this == vars.tenantId", message: "El participante no pertenece a la empresa")
      branchId
        @check(expr: "this == vars.branchId", message: "El participante no pertenece a la sucursal")
      removedAt @check(expr: "this == null", message: "El participante ya fue expulsado")
    }
  }
  sessionParticipant_update(
    id: $participantId
    data: { removedAt_expr: "request.time", removedBy_expr: "auth.uid" }
  )
  auditEvent_insert(
    data: {
      tenantId: $tenantId
      actorId_expr: "auth.uid"
      operation: "session_participant.remove"
      resourceType: "session_participant"
      resourceId_expr: "vars.participantId"
    }
  )
}
